<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Southwest Airlines — Microsoft 365 Copilot Hands-on Walkthrough</title>
<meta name="description" content="A live, hands-on Microsoft 365 Copilot walkthrough for Southwest Airlines teams: the prompting pattern, personalization, grounding, working across applications, and Edit with Copilot.">
<style>
  :root{
    --brand:#304CB2;--brand-deep:#16225E;--brand-soft:#E9EDFA;
    --ink:#1B2233;--paper:#FFFFFF;--cream:#F4F6FB;
    --red:#E4002B;--red-soft:#FDE7EA;--gold:#C97C00;--gold-soft:#FBF1DE;
    --muted:#6B7488;--line:rgba(27,34,51,.14);--shadow:0 20px 55px rgba(22,34,94,.12);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;color:var(--ink);overflow-x:hidden;
    background:linear-gradient(160deg,transparent 0 70%,rgba(48,76,178,.05) 70% 100%),var(--cream);
    font-family:"Segoe UI","Aptos",system-ui,sans-serif;line-height:1.5;}
  button,a,select{font:inherit;} a{color:inherit;} button{color:inherit;cursor:pointer;}
  .skip-link{position:fixed;top:.75rem;left:-999px;z-index:200;padding:.7rem 1rem;color:#fff;background:var(--ink);}
  .skip-link:focus{left:.75rem;}

  .topbar{position:sticky;top:0;z-index:100;display:grid;
    grid-template-columns:minmax(220px,1fr) minmax(240px,540px) auto;align-items:center;gap:1.4rem;
    min-height:74px;padding:.7rem clamp(1rem,3vw,2.1rem);
    background:rgba(255,255,255,.97);border-bottom:4px solid var(--brand);backdrop-filter:blur(10px);}
  .brand{display:flex;align-items:center;gap:.85rem;min-width:0;}
  .brand img.slogo{height:24px;} .brand img.mslogo{height:21px;}
  .brand .x{color:var(--muted);font-weight:700;}
  .brand small{display:block;color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-top:2px;}
  .progress-label{display:flex;justify-content:space-between;margin-bottom:.4rem;color:var(--muted);font-size:.7rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;}
  .progress-track{height:.42rem;background:rgba(48,76,178,.15);overflow:hidden;border-radius:3px;}
  .progress-fill{display:block;width:14%;height:100%;background:linear-gradient(90deg,var(--brand-deep),#5f7ee0);transition:width .24s ease;}
  .badge{padding:.42rem .6rem;color:#fff;background:var(--brand);font-size:.68rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;border-radius:5px;}

  .layout{display:grid;grid-template-columns:290px minmax(0,1fr) 300px;gap:1.2rem;width:min(1660px,100%);margin:0 auto;padding:1.2rem;}
  .rail,.resources{position:sticky;top:98px;align-self:start;max-height:calc(100vh - 116px);overflow:auto;}
  .rail{padding:1rem;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;}
  .rail-header{padding:.2rem .4rem .9rem;border-bottom:1px solid var(--line);}
  .eyebrow{margin:0 0 .5rem;color:var(--brand);font-size:.68rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;}
  h1,h2,h3,h4{margin:0;letter-spacing:-.02em;}
  h1{font-size:1.42rem;line-height:1.08;} h2{font-size:clamp(1.9rem,3.6vw,3.1rem);line-height:1.04;color:var(--brand-deep);} h3{font-size:1.28rem;} h4{font-size:1.02rem;}
  .nav{display:grid;gap:.3rem;padding-top:.8rem;}
  .nav-button{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.65rem;align-items:center;width:100%;padding:.6rem;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;}
  .nav-button:hover,.nav-button:focus-visible{background:var(--brand-soft);}
  .nav-button.is-active{color:#fff;background:var(--brand-deep);}
  .nav-number{display:grid;place-items:center;width:2rem;height:2rem;color:#fff;background:var(--brand);font-size:.72rem;font-weight:900;border-radius:6px;}
  .nav-button strong{font-size:.92rem;} .nav-button small{display:block;margin-top:.08rem;color:var(--muted);font-size:.74rem;}
  .nav-button.is-active small{color:rgba(255,255,255,.72);}

  .stage{min-width:0;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;}
  .panel{display:none;min-height:calc(100vh - 168px);padding:clamp(1.5rem,4vw,3.4rem);}
  .panel.is-active{display:block;animation:reveal .28s ease-out both;}
  @keyframes reveal{from{transform:translateY(10px);opacity:.4;}to{transform:translateY(0);opacity:1;}}
  .kicker{display:flex;align-items:center;gap:.7rem;width:fit-content;margin-bottom:1rem;color:var(--brand);font-size:.74rem;font-weight:900;letter-spacing:.13em;text-transform:uppercase;}
  .kicker::before{content:"";width:2.4rem;height:4px;background:var(--red);}
  .lede{max-width:840px;margin:1.1rem 0 1.7rem;color:var(--muted);font-size:clamp(1.02rem,1.6vw,1.26rem);}

  .grid3,.grid2,.grid4{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .grid3{grid-template-columns:repeat(3,1fr);} .grid2{grid-template-columns:repeat(2,1fr);} .grid4{grid-template-columns:repeat(4,1fr);}
  .grid3 article,.grid2 article,.grid4 article{padding:1.1rem;background:var(--paper);}
  .grid3 strong,.grid2 strong,.grid4 strong{display:block;margin-bottom:.25rem;color:var(--brand-deep);font-size:1.02rem;}
  .grid3 p,.grid2 p,.grid4 p{margin:.3rem 0 0;color:var(--muted);font-size:.9rem;}

  .formula{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:1.3rem 0;border-radius:8px;overflow:hidden;}
  .formula span{padding:1rem;text-align:center;font-weight:800;color:#fff;font-size:.92rem;}
  .ing-g{background:#3B3F9E;} .ing-c{background:#0F7A87;} .ing-s{background:#8F2D56;} .ing-e{background:#C25A00;}
  @media(max-width:980px){.formula{grid-template-columns:repeat(2,1fr);}}

  .scenario{position:relative;margin:1.7rem 0;padding:1.35rem 1.5rem;color:#fff;background:var(--brand-deep);overflow:hidden;border-radius:10px;}
  .scenario strong{font-size:1.12rem;} .scenario p{max-width:760px;margin:.5rem 0 0;color:rgba(255,255,255,.88);}

  .meta{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0;}
  .pill{padding:.36rem .6rem;background:var(--brand-soft);font-size:.76rem;font-weight:800;border-radius:5px;color:var(--brand-deep);}
  .pill.red{background:var(--red-soft);color:var(--red);} .pill.solid{background:var(--brand);color:#fff;}

  .prompt-card{margin:1.1rem 0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:8px 8px 0 rgba(48,76,178,.1);overflow:hidden;}
  .prompt-card.red{box-shadow:8px 8px 0 rgba(228,0,43,.1);}
  .prompt-header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.72rem 1rem;border-bottom:1px solid var(--line);background:var(--brand-soft);}
  .prompt-card.red .prompt-header{background:var(--red-soft);}
  .prompt-header h4{letter-spacing:0;color:var(--ink);}
  pre{margin:0;padding:1.05rem;white-space:pre-wrap;color:#2c2c2c;font:600 .95rem/1.6 "Segoe UI","Aptos",sans-serif;}
  .copy-button{padding:.42rem .7rem;color:#fff;background:var(--ink);border:0;font-weight:800;border-radius:6px;}
  .copy-button:hover,.copy-button:focus-visible{background:var(--brand);} .copy-button.copied{background:var(--brand);}

  .try-tag,.demo-tag{padding:.32rem .58rem;font-size:.68rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border-radius:5px;}
  .try-tag{color:#fff;background:var(--brand);} .demo-tag{color:#fff;background:var(--red);}
  .prompt-card.red .try-tag{background:var(--red);}

  .gcse{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;padding:.5rem 1rem;background:#FAFBFD;border-bottom:1px solid var(--line);}
  .gcse::before{content:"G · C · S · E";margin-right:.15rem;color:var(--muted);font-size:.62rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;}
  .gcse span{padding:.2rem .46rem;color:#fff;font-size:.62rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;}
  .gcse .g{background:#3B3F9E;} .gcse .c{background:#0F7A87;} .gcse .s{background:#8F2D56;} .gcse .e{background:#C25A00;}
  .gcse.live::after{content:"shown in the prompt below";margin-left:.2rem;color:var(--muted);font-size:.62rem;font-weight:700;letter-spacing:.02em;text-transform:none;}
  .why{margin:.55rem 0 0;padding:.6rem .8rem;background:var(--cream);border-left:3px solid var(--line);border-radius:0 6px 6px 0;color:var(--muted);font-size:.82rem;}
  .why b{color:var(--ink);}

  pre .g,pre .c,pre .s,pre .e{padding:.06em .18em;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
  pre .g{background:rgba(59,63,158,.14);box-shadow:inset 0 -2px 0 #3B3F9E;}
  pre .c{background:rgba(15,122,135,.14);box-shadow:inset 0 -2px 0 #0F7A87;}
  pre .s{background:rgba(143,45,86,.14);box-shadow:inset 0 -2px 0 #8F2D56;}
  pre .e{background:rgba(194,90,0,.14);box-shadow:inset 0 -2px 0 #C25A00;}

  .opt-or{display:flex;align-items:center;gap:.9rem;margin:1.1rem 0;color:var(--muted);font-size:.72rem;font-weight:900;letter-spacing:.12em;}
  .opt-or::before,.opt-or::after{content:"";flex:1;height:1px;background:var(--line);}
  .opt-tag{padding:.3rem .6rem;color:#fff;background:var(--ink);border-radius:5px;font-size:.66rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;}
  .opt-tag.b{background:var(--red);}

  .flow{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;margin:.45rem 0 0;}
  .flow span{padding:.34rem .6rem;background:var(--brand-soft);color:var(--brand-deep);border-radius:5px;font-size:.78rem;font-weight:800;}
  .flow i{color:var(--muted);font-style:normal;font-weight:900;}
  .flow.red span{background:var(--red-soft);color:var(--red);}
  .pattern{padding:.85rem 1.05rem;background:#fff;border:1px solid var(--line);border-radius:9px;margin:.55rem 0;}
  .pattern b{display:block;font-size:.92rem;color:var(--ink);}
  .pattern em{display:block;margin-top:.15rem;color:var(--muted);font-size:.8rem;font-style:normal;}

  .datafile{display:flex;gap:.85rem;align-items:flex-start;margin:1.1rem 0;padding:.95rem 1.1rem;background:#fff;border:1px solid var(--line);border-left:6px solid var(--red);border-radius:0 9px 9px 0;}
  .datafile .ic{flex:0 0 auto;width:2.1rem;height:2.1rem;display:grid;place-items:center;background:var(--red-soft);color:var(--red);border-radius:6px;font-size:1rem;}
  .datafile b{display:block;font-size:.94rem;color:var(--ink);}
  .datafile p{margin:.2rem 0 0;color:var(--muted);font-size:.85rem;}
  .datafile code{padding:.1rem .35rem;background:var(--cream);border-radius:4px;font-size:.82rem;font-family:Consolas,monospace;}

  .dl{display:inline-flex;align-items:center;gap:.4rem;margin:.5rem .4rem 0 0;padding:.5rem .8rem;color:#fff;background:var(--brand);border-radius:6px;font-size:.82rem;font-weight:800;text-decoration:none;}
  .dl:hover,.dl:focus-visible{background:var(--ink);}
  .dl::before{content:"\2193";font-weight:900;}
  .resource-block a.dl{display:inline-flex;color:#fff;padding:.5rem .8rem;}

  .vs{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:1.2rem 0;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .vs>div{padding:1rem 1.15rem;background:#fff;}
  .vs h5{margin:0 0 .3rem;font-size:.95rem;letter-spacing:0;}
  .vs p{margin:.25rem 0 0;color:var(--muted);font-size:.85rem;}
  @media(max-width:760px){.vs{grid-template-columns:1fr;}}

  .steps{display:grid;gap:.6rem;margin:1.2rem 0;padding:0;list-style:none;counter-reset:steps;}
  .steps li{position:relative;padding-left:2.95rem;min-height:2.2rem;}
  .steps li::before{counter-increment:steps;content:counter(steps);position:absolute;left:0;top:0;display:grid;place-items:center;width:2.2rem;height:2.2rem;color:#fff;background:var(--brand);font-weight:900;border-radius:6px;}
  .steps.red li::before{background:var(--red);}
  .steps strong{display:block;} .steps small{color:var(--muted);display:block;}

  .note{margin:1.2rem 0;padding:1rem 1.15rem;border-left:6px solid var(--brand);background:var(--brand-soft);border-radius:0 8px 8px 0;}
  .note.red{border-color:var(--red);background:var(--red-soft);} .note.amber{border-color:var(--gold);background:var(--gold-soft);}
  .note strong{display:block;margin-bottom:.2rem;}
  .note .lbl{display:block;margin-bottom:.35rem;font-size:.72rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);}
  .note.red .lbl{color:var(--red);} .note.amber .lbl{color:var(--gold);}

  .apps{display:flex;flex-wrap:wrap;gap:.55rem;margin:1.1rem 0;}
  .app{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:.85rem;font-weight:800;color:var(--ink);}
  .app img{width:20px;height:20px;object-fit:contain;}

  .habit{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:1.2rem 0;}
  .habit div{padding:.9rem 1rem;background:#fff;border:1px solid var(--line);border-top:5px solid var(--brand);border-radius:0 0 9px 9px;}
  .habit b{display:block;font-size:.92rem;color:var(--brand-deep);}
  .habit p{margin:.3rem 0 0;color:var(--muted);font-size:.84rem;}
  @media(max-width:860px){.habit{grid-template-columns:1fr;}}

  .guide{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-top:2rem;padding-top:1.3rem;border-top:1px solid var(--line);}
  .guide-button{padding:.7rem 1.05rem;color:#fff;background:var(--brand);border:0;font-weight:800;border-radius:7px;}
  .guide-button.secondary{color:var(--brand-deep);background:var(--brand-soft);}

  .resources{padding:1.1rem;color:#fff;background:var(--brand-deep);box-shadow:var(--shadow);border-radius:12px;}
  .resources h2{font-size:1.35rem;margin-bottom:.9rem;color:#fff;}
  .resource-block{padding:.85rem 0;border-top:1px solid rgba(255,255,255,.14);}
  .resource-block h3{margin-bottom:.5rem;color:#FFBF27;font-size:.72rem;font-weight:900;letter-spacing:.11em;text-transform:uppercase;}
  .resource-block a{display:block;margin:.4rem 0;color:rgba(255,255,255,.84);font-size:.86rem;text-decoration:none;}
  .resource-block a:hover{color:#fff;} .resource-block a::before{content:"→ ";color:#FFBF27;}
  .ph{color:rgba(255,255,255,.55);font-size:.8rem;font-style:italic;}
  .step-tag{margin-left:.4rem;padding:.12rem .4rem;background:#FFBF27;color:#3a2a00;border-radius:4px;font-size:.62rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;vertical-align:middle;}
  .resource-block a.open-copilot::before{content:none;}
  .open-copilot{display:flex;align-items:center;gap:.6rem;width:100%;margin:.1rem 0 .5rem;padding:.7rem .8rem;background:#fff;border-radius:9px;text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:.15s;}
  .open-copilot:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.26);}
  .open-copilot img{width:30px;height:27px;flex:0 0 auto;}
  .open-copilot .oc-t{display:block;color:var(--ink);font-size:.86rem;font-weight:900;line-height:1.2;}
  .open-copilot .oc-s{display:block;margin-top:.1rem;color:var(--muted);font-size:.72rem;font-weight:700;}

  @media (max-width:1340px){.layout{grid-template-columns:262px minmax(0,1fr) 268px;gap:.85rem;padding:.85rem;}}
  @media (max-width:1040px){.layout{grid-template-columns:250px minmax(0,1fr);}.resources{position:static;grid-column:1/-1;max-height:none;}}
  @media (max-width:780px){
    .topbar{grid-template-columns:1fr auto;gap:.7rem;} .topbar-progress{grid-column:1/-1;grid-row:2;}
    .layout{display:block;padding:.75rem;} .rail{position:static;max-height:none;margin-bottom:.75rem;}
    .nav{grid-template-columns:repeat(2,1fr);} .nav-button small{display:none;}
    .grid3,.grid2,.grid4,.formula{grid-template-columns:1fr;} pre,h2,h3,p,a{overflow-wrap:anywhere;} .guide{flex-wrap:wrap;}
  }
</style>
<style>
#gate{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;
  justify-content:center;background:#f3f4f6;padding:20px;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
#gate *{box-sizing:border-box}
#gate .gate-card{width:100%;max-width:430px;background:#fff;border-radius:16px;
  padding:34px 32px;box-shadow:0 18px 50px rgba(0,0,0,.16)}
#gate .band{height:4px;border-radius:4px;background:#304CB2;margin:0 0 20px}
#gate h1{font-size:19px;margin:0 0 6px;color:#111827;line-height:1.3;font-weight:700}
#gate .sub{color:#6b7280;font-size:13.5px;margin:0 0 20px;line-height:1.5}
#gate label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:#374151;margin-bottom:7px}
#gate input{width:100%;padding:11px 13px;border:1.5px solid #d1d5db;border-radius:9px;
  font-size:15px;outline:none;font-family:inherit;color:#111827;background:#fff}
#gate input:focus{border-color:#304CB2}
#gate button{width:100%;margin-top:14px;padding:11px;border:0;border-radius:9px;
  background:#304CB2;color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;
  font-family:inherit}
#gate button:hover{filter:brightness(1.08)}
#gate .gate-err{color:#b3261e;font-size:12.5px;margin:10px 0 0;min-height:17px;line-height:1.45}
#gate .gate-foot{margin-top:18px;padding-top:14px;border-top:1px solid #e5e7eb;
  font-size:11.5px;color:#9ca3af;line-height:1.45}
</style>
</head>
<body>
<div id="gate">
  <div class="gate-card">
    <div class="band"></div>
    <h1>Microsoft 365 Copilot &mdash; Hands-on Walkthrough</h1>
    <p class="sub">Enter the passphrase from your session invite to open the walkthrough.</p>
    <label for="pw">Passphrase</label>
    <input id="pw" type="password" autocomplete="off" spellcheck="false"
           autocapitalize="off" autocorrect="off" placeholder="From your invite">
    <button id="unlock" type="button">Open</button>
    <p class="gate-err" id="gerr"></p>
    <div class="gate-foot">Prepared for Southwest Airlines. Practice data is fictional.</div>
  </div>

<script>
const B64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptPayload(pass){
  const blob = JSON.parse(atob(document.getElementById('payload').textContent.trim()));
  const salt = B64(blob.s), iv = B64(blob.i), ct = B64(blob.c);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:blob.n, hash:'SHA-256'},
                km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
const gerr = document.getElementById('gerr');

/* Pasting the passphrase out of an invite drags along invisible damage: a
   trailing space or newline, a non-breaking space, or a hyphen the mail client
   autocorrected into an en dash. Each one fails against an otherwise correct
   passphrase, so try the repaired forms before giving up. The canonical
   passphrase is lower case, so a lower-cased attempt costs no real entropy. */
function passVariants(raw){
  const cleaned = String(raw == null ? '' : raw)
    .replace(/[\u200B-\u200D\uFEFF]/g, '')
    .replace(/[\u00A0\u2007\u202F]/g, ' ')
    .trim();
  const straight = cleaned
    .replace(/[\u2010-\u2015\u2212]/g, '-')
    .replace(/[\u2018\u2019\u201B\u2032]/g, "'")
    .replace(/[\u201C\u201D\u2033]/g, '"');
  const out = [];
  for(const v of [cleaned, straight, straight.replace(/\s+/g,''),
                  straight.toLowerCase(), straight.toLowerCase().replace(/\s+/g,'')]){
    if(v && out.indexOf(v) === -1) out.push(v);
  }
  return out;
}

async function tryUnlock(pass, silent){
  const cands = passVariants(pass);
  if(!cands.length){
    if(!silent){ gerr.textContent = 'Enter the passphrase from your session invite.'; }
    else { document.getElementById('gate').style.display = 'flex'; }
    return;
  }
  gerr.textContent = silent ? '' : 'Checking\u2026';
  let d = null, accepted = null;
  for(const c of cands){
    try{ d = await decryptPayload(c); accepted = c; break; }
    catch(e){ /* try the next repaired form */ }
  }
  if(d){
    try{ sessionStorage.setItem("swa-handson-key", accepted); }catch(e){}
    document.getElementById('gate').remove();
    const app = document.getElementById('app');
    app.innerHTML = d.html;
    app.style.display = 'block';
    const _origAdd = document.addEventListener.bind(document);
    document.addEventListener = function(type, fn, opts){
      if(type === 'DOMContentLoaded'){ try{ fn(new Event(type)); }catch(e){ console.error(e); } return; }
      return _origAdd(type, fn, opts);
    };
    const _winAdd = window.addEventListener.bind(window);
    window.addEventListener = function(type, fn, opts){
      if(type === 'load'){ try{ fn(new Event(type)); }catch(e){ console.error(e); } return; }
      return _winAdd(type, fn, opts);
    };
    const s = document.createElement('script');
    s.textContent = d.js;
    document.body.appendChild(s);
    document.addEventListener = _origAdd;
    window.addEventListener = _winAdd;
  } else {
    if(!silent){
      gerr.textContent = 'That passphrase did not work. Check your session invite \u2014 '
        + 'if you pasted it, try typing it instead.';
    }
    else { document.getElementById('gate').style.display = 'flex'; }
  }
}
document.getElementById('unlock').onclick = () => tryUnlock(document.getElementById('pw').value, false);
document.getElementById('pw').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('unlock').click(); }
});
(function(){
  let k = null;
  try{ k = sessionStorage.getItem("swa-handson-key"); }catch(e){}
  if(k){ document.getElementById('gate').style.display = 'none'; tryUnlock(k, true); }
  else { setTimeout(() => { const el = document.getElementById('pw'); if(el) el.focus(); }, 80); }
})();
</script>
